# Stack complète de développement et d'intégration.
# Les chemins sont relatifs à la racine du dépôt (voir compose.yaml).
name: arksen

x-node-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 15s

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER manquant dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant dans .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB manquant dans .env}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-15432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      <<: *healthcheck-defaults

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ exige `noeviction`, et l'AOF conserve les files au redémarrage.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD manquant dans .env}
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - 'yes'
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-16379}:6379'
    volumes:
      - redis-data:/data
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      <<: *healthcheck-defaults

  # Provisionne les rôles applicatifs, applique les migrations Prisma, puis s'arrête.
  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD manquant dans .env}
      SYSTEM_DB_PASSWORD: ${SYSTEM_DB_PASSWORD:?SYSTEM_DB_PASSWORD manquant dans .env}
    depends_on:
      postgres:
        condition: service_healthy

  analytics:
    build:
      context: .
      dockerfile: infrastructure/docker/analytics.Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:${ANALYTICS_HOST_PORT:-8000}:8000'
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      <<: *healthcheck-defaults

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:?DEPLOYMENT_MODE manquant dans .env}
      API_PORT: 4000
      # L'API ne se connecte jamais avec le propriétaire de la base.
      DATABASE_APP_URL: postgresql://arksen_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SYSTEM_URL: postgresql://arksen_system:${SYSTEM_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ANALYTICS_URL: http://analytics:8000
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?PUBLIC_WEB_URL manquant dans .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET manquant dans .env}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-}
    ports:
      - '127.0.0.1:${API_HOST_PORT:-4000}:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      analytics:
        condition: service_healthy
    healthcheck:
      # Échoue sur un 503 : le conteneur n'est sain que si la base et Redis répondent.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      <<: *healthcheck-defaults

  workers:
    build:
      context: .
      dockerfile: infrastructure/docker/workers.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # Le heartbeat n'existe que si une tâche BullMQ a réellement été traitée.
      test:
        - CMD
        - node
        - -e
        - |
          import('ioredis').then(async ({ Redis }) => {
            const redis = new Redis(process.env.REDIS_URL, { lazyConnect: true, maxRetriesPerRequest: 1 });
            await redis.connect();
            const beat = await redis.get('arksen:workers:heartbeat');
            redis.disconnect();
            process.exit(beat ? 0 : 1);
          }).catch(() => process.exit(1));
      <<: *healthcheck-defaults

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_INTERNAL_URL: http://api:4000
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      <<: *healthcheck-defaults

volumes:
  postgres-data:
  redis-data:
